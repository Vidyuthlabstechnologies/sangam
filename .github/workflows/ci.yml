name: Sangam CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx
          pip install -r requirements.txt

      # Blocking: only rules that find real bugs (undefined names, redefinitions,
      # syntax errors). A missing import once shipped here and was swallowed at runtime.
      - name: Lint for real bugs with Ruff
        run: ruff check app/ --select F821,F811,E9

      # Advisory: the wider backlog (unused imports and the like). No --fix in CI;
      # a pipeline that rewrites its own checkout proves nothing.
      - name: Full Ruff report (advisory)
        run: ruff check app/
        continue-on-error: true

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports

      - name: Test with pytest
        run: pytest tests/ -v --cov=app --cov-report=term --cov-report=xml

  backend-build:
    runs-on: ubuntu-latest
    needs: [backend-lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: [backend-build, web-build]

    steps:
      - name: Deploy to staging
        run: echo "Deploying to staging via ArgoCD"
