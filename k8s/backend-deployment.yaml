apiVersion: apps/v1
kind: Deployment
metadata:
  name: sangam-backend
  namespace: sangam
  labels:
    app: sangam
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sangam
      component: backend
  template:
    metadata:
      labels:
        app: sangam
        component: backend
    spec:
      containers:
        - name: backend
          image: sangam/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: redis_url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: rabbitmq_url
            - name: TEMPORAL_HOST
              value: temporal-service:7233
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: jwt_secret
            - name: ZITADEL_ISSUER
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: zitadel_issuer
                  optional: true
            - name: ZITADEL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: zitadel_client_id
                  optional: true
            - name: ZITADEL_ANDROID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: zitadel_android_client_id
                  optional: true
            - name: ZITADEL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: zitadel_project_id
                  optional: true
            - name: ZITADEL_JWKS_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: zitadel_jwks_url
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sangam-backend-service
  namespace: sangam
spec:
  selector:
    app: sangam
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
