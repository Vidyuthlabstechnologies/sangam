apiVersion: apps/v1
kind: Deployment
metadata:
  name: sangam-backend
  namespace: sangam
  labels:
    app: sangam
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sangam
      component: backend
  template:
    metadata:
      labels:
        app: sangam
        component: backend
    spec:
      containers:
        - name: backend
          image: sangam/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: redis_url
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: rabbitmq_url
            - name: TEMPORAL_HOST
              value: temporal-service:7233
            - name: ENVIRONMENT
              value: production
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: jwt_secret
            # Optional MinIO/S3. Missing keys leave object storage off.
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: s3_endpoint_url
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: s3_bucket
                  optional: true
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: s3_access_key
                  optional: true
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: s3_secret_key
                  optional: true
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: smtp_host
                  optional: true
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: smtp_username
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sangam-secrets
                  key: smtp_password
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sangam-backend-service
  namespace: sangam
spec:
  selector:
    app: sangam
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
