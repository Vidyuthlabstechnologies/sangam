# Local development only. Passwords below are dev defaults so
# `docker compose up` works without a secret store. Production manifests
# under k8s/ read passwords from the sangam-secrets Secret.
# Backup (operator-run, never from CI):
#   DATABASE_URL='postgresql://USER:PASSWORD@localhost:5432/sangam' ./scripts/backup_postgres.sh
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sangam
      POSTGRES_USER: sangam
      POSTGRES_PASSWORD: sangam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.0
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      DB: postgresql
      POSTGRES_USER: sangam
      POSTGRES_PASSWORD: sangam
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy

  temporal-admin-tools:
    image: temporalio/admin-tools:1.24.0
    depends_on:
      - temporal

  sangam-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://sangam:sangam@postgres:5432/sangam
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      TEMPORAL_HOST: temporal:7233
      ENVIRONMENT: development
      # Dev-only signing key. Production refuses this value.
      JWT_SECRET: dev-secret-change-in-production
      # Empty by default so `docker compose up` does not point at Zitadel Cloud.
      ZITADEL_ISSUER: ${ZITADEL_ISSUER:-}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:-}
      ZITADEL_ANDROID_CLIENT_ID: ${ZITADEL_ANDROID_CLIENT_ID:-}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID:-}
      ZITADEL_JWKS_URL: ${ZITADEL_JWKS_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  # Optional. Not started by `docker compose up`.
  # docker compose --profile storage up
  # Then set S3_ENDPOINT_URL=http://minio:9000 S3_BUCKET=sangam
  # S3_ACCESS_KEY and S3_SECRET_KEY to the dev root user below.
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Identity is a separate file so this stack does not require ZITADEL_MASTERKEY
  # and does not point at Zitadel Cloud:
  #   docker compose -f docker-compose.zitadel.yml up -d

volumes:
  postgres_data:
  minio_data:
