# Self-hosted Zitadel (open source). Not part of the default `docker compose up`,
# and not Zitadel Cloud.
#
#   export ZITADEL_MASTERKEY="$(openssl rand -base64 24 | tr -d '\n' | cut -c1-32)"
#   # ZITADEL_MASTERKEY must be exactly 32 bytes. Do not commit the value.
#   docker compose -f docker-compose.zitadel.yml up -d
#
# Console and issuer: http://localhost:8080
# Create one organization per customer and two public PKCE applications
# (no client secret). Redirect URIs:
#   web:     http://localhost:3000/login
#   android: com.sangam.app:/oauth2callback
# Request scope urn:zitadel:iam:user:resourceowner so tokens carry the org id.
# Set the API's ZITADEL_ISSUER=http://localhost:8080 and the public client ids.
# Initial admin password: set ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD before
# the first start, or change the password Zitadel generates in the console.

services:
  zitadel-db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - zitadel_postgres_data:/var/lib/postgresql/data
    networks:
      - identity

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    user: "0"
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY must be 32 bytes}
    environment:
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:zitadel@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8080/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 30s
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap
    depends_on:
      zitadel-db:
        condition: service_healthy
    networks:
      - identity
    labels:
      - traefik.enable=true
      - traefik.docker.network=sangam-identity
      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.routers.zitadel-api-alias.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api-alias.entrypoints=web
      - traefik.http.routers.zitadel-api-alias.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api-alias.service=zitadel-api
      - traefik.http.routers.zitadel-api-alias.priority=200
      - traefik.http.routers.zitadel-api.rule=Host(`localhost`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`) && !Path(`/`)
      - traefik.http.routers.zitadel-api.entrypoints=web
      - traefik.http.routers.zitadel-api.service=zitadel-api
      - traefik.http.routers.zitadel-api.priority=100

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.0
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 15
      start_period: 20s
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
    networks:
      - identity
    labels:
      - traefik.enable=true
      - traefik.docker.network=sangam-identity
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000
      - traefik.http.middlewares.zitadel-root-rewrite.replacepath.path=/ui/v2/login/
      - traefik.http.routers.zitadel-root.rule=Host(`localhost`) && Path(`/`)
      - traefik.http.routers.zitadel-root.entrypoints=web
      - traefik.http.routers.zitadel-root.middlewares=zitadel-root-rewrite
      - traefik.http.routers.zitadel-root.service=zitadel-login
      - traefik.http.routers.zitadel-root.priority=400
      - traefik.http.routers.zitadel-login.rule=Host(`localhost`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250

  zitadel-proxy:
    image: traefik:v3.7.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=sangam-identity
      - --entrypoints.web.address=:80
      - --api.insecure=false
      - --ping=true
      - --ping.entrypoint=web
      - --log.level=INFO
    ports:
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    networks:
      - identity

volumes:
  zitadel_postgres_data:
  zitadel_bootstrap:

networks:
  identity:
    name: sangam-identity
